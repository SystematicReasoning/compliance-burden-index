name: Regenerate Compliance Burden Index from versioned inputs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly regeneration from checked-in inputs (does NOT fetch upstream data; only re-runs the pipeline against the data committed to the repo)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install LaTeX (for paper build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            lmodern

      - name: Run test suite
        run: pytest tests/ -v

      - name: Ensure results directories exist
        run: mkdir -p results/figures results/tables

      - name: Regenerate headline (TLS BR per-persona, capacity ratios)
        run: python scripts/compute_headline.py

      - name: Per-regime cadence comparison (Tier 1 + Tier 2)
        run: python scripts/per_regime_cadence.py

      - name: Per-regime multi-dimensional workload
        run: python scripts/per_regime_workload.py

      - name: CABF stack change-handling burden
        run: python scripts/stack_change_burden.py

      - name: CABF stack FTE-equivalent visualization
        run: python scripts/cabf_stack_fte.py

      - name: Regenerate TLS BR figures
        run: python scripts/make_figures.py

      - name: Build academic paper PDF
        run: python scripts/build_paper.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cbi-results
          path: |
            results/current.json
            results/tables/
            results/figures/
            papers/compliance-burden-index/cbi.pdf
          retention-days: 90
